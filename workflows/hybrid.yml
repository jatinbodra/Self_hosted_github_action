# Workflow template — hybrid.
#
# Lint + test run on GitHub-hosted runners (clean VM, parallelizable,
# ~1-2 minutes per job — well under the free 3,000 min/month allowance).
# The expensive build + deploy step runs on your self-hosted runner.
#
# This is the recommended setup for most projects:
# - keeps GitHub's "PR gate" experience for free
# - the long, expensive step (build + deploy) costs nothing
#
# Copy to .github/workflows/deploy.yml, adjust paths to your project.

name: 🚀 CI + Deploy (hybrid)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────
  # CI gate — fast, parallel, on GitHub-hosted runners.
  # Skip the deploy job entirely on PRs (just run checks).
  # ─────────────────────────────────────────────────────
  check-backend:
    name: ✅ Backend check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # cache-dependency-path: REST_API/package-lock.json
      # - run: cd REST_API && npm ci
      # - run: cd REST_API && npm run lint
      # - run: cd REST_API && npm test
      - run: echo "Replace this with your backend check commands"

  check-frontend:
    name: ✅ Frontend check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # cache-dependency-path: Web_Portal/package-lock.json
      # - run: cd Web_Portal && npm ci
      # - run: cd Web_Portal && npm run typecheck
      # - run: cd Web_Portal && npm run lint
      - run: echo "Replace this with your frontend check commands"

  # ─────────────────────────────────────────────────────
  # Deploy — only on main push, only after checks pass,
  # runs on YOUR machine (free).
  # ─────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    runs-on: self-hosted
    needs: [check-backend, check-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 📥 Install + build + restart
        run: |
          # Replace with your project's deploy commands. Examples:
          # cd REST_API && npm ci && npx prisma generate && npx prisma migrate deploy
          # cd ../Web_Portal && npm ci && npm run build
          # pm2 reload all
          echo "Replace this block with your deploy commands"
